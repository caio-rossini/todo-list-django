{% extends "tasks/base.html" %}

{% block content %}
<h1>{% if form.instance.pk %}Update Tag{% else %}Add Tag{% endif %}</h1>

<form method="post" class="mt-4" style="max-width: 400px;">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Name</label>
        {{ form.name }}
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'tasks:tag-list' %}" class="btn btn-secondary ms-2">Cancel</a>
</form>
{% endblock %}
